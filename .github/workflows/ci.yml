name: Portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check js/main.js && node --check js/commands.js && node --check js/caret.js
